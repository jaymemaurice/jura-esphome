button:
  # Direct physical recipe-slot buttons. Their function is whatever EEPROM
  # currently assigns to that slot. Hidden from HA by default to avoid accidental
  # brews; set expose_recipe_buttons: true if direct slot presses are desired.
  - platform: jura
    jura_id: jura_machine
    expose_recipe_buttons: false
    recipe_1:
      name: "Press Recipe 1"
    recipe_2:
      name: "Press Recipe 2"
    recipe_3:
      name: "Press Recipe 3"
    recipe_4:
      name: "Press Recipe 4"
    recipe_5:
      name: "Press Recipe 5"
    recipe_6:
      name: "Press Recipe 6"
    recipe_7:
      name: "Press Recipe 7"
    recipe_8:
      name: "Press Recipe 8"
    recipe_9:
      name: "Press Recipe 9"
    recipe_10:
      name: "Press Recipe 10"
    program_settings:
      name: "Press Program"
    exit:
      name: "Press Exit"
    minus:
      name: "Press -"
    plus:
      name: "Press +"

  - platform: template
    id: start_operation
    name: "Start Operation"
    icon: "mdi:play"
    on_press:
      - script.execute: reset_operation_controls_timer
      - if:
          condition:
            lambda: |-
              return id(grinder_override_timeout).state > 0.0f &&
                     id(jura_grinder).current_option() != "Default";
          then:
            - script.execute: reset_grinder_override_timer
      - lambda: |-
          const std::string operation = id(jura_operation).current_option();
          const uint8_t repeats = static_cast<uint8_t>(id(operation_repeats).state);
          bool started = false;
          const auto operation_index = id(jura_operation).active_index();
          if (operation_index.has_value() && operation_index.value() < 10) {
            started = id(jura_machine).start_brew_recipe_slot(
                static_cast<uint8_t>(operation_index.value() + 1U), repeats,
                std::string(id(jura_grinder).current_option()));
          } else if (operation == "Rinse") {
            started = id(jura_machine).queue_named_command(::esphome::jura::JuraButtonType::RINSE);
          } else if (operation == "Clean Coffee") {
            started = id(jura_machine).queue_named_command(::esphome::jura::JuraButtonType::CLEAN_COFFEE);
          } else if (operation == "Decalcifying") {
            started = id(jura_machine).queue_named_command(::esphome::jura::JuraButtonType::DECALCIFY);
          } else if (operation == "Clean Milk System") {
            started = id(jura_machine).queue_named_command(::esphome::jura::JuraButtonType::CLEAN_MILK_SYSTEM);
          } else {
            started = id(jura_machine).start_brew_batch(
                operation, repeats, std::string(id(jura_grinder).current_option()));
          }
          if (!started)
            ESP_LOGW("jura", "OPERATION: request rejected operation=%s", operation.c_str());

  - platform: template
    id: start_debug_operation
    name: "Start Debug Operation"
    icon: "mdi:bug-play-outline"
    entity_category: diagnostic
    internal: ${hide_debug_tools}
    on_press:
      - lambda: |-
          const std::string operation = id(jura_debug_operation).current_option();
          const uint8_t repeats = static_cast<uint8_t>(id(operation_repeats).state);
          const uint32_t window_ms = static_cast<uint32_t>(id(experiment_window).state * 1000.0f);
          bool started = false;
          if (operation == "Grinder Mapping") {
            started = id(jura_machine).start_grinder_mapping(repeats);
          } else if (operation == "Clock/Timer Mapping") {
            started = id(jura_machine).start_clock_timer_mapping(repeats, window_ms);
          } else if (operation == "Top-Level Menu RAM Discovery") {
            started = id(jura_machine).start_menu_mapping(repeats);
          } else if (operation == "Menu Section RAM Discovery" || operation == "Menu RAM Discovery") {
            // "Menu RAM Discovery" is retained as a compatibility alias for
            // mixed/older HA state, but is no longer shown in the selector.
            started = id(jura_machine).start_menu_ram_discovery_section(
                std::string(id(jura_menu_discovery_section).current_option()));
          } else if (operation == "Full Menu RAM Discovery") {
            started = id(jura_machine).start_full_menu_ram_discovery(repeats);
          } else if (operation == "RAM Experiment") {
            started = id(jura_machine).start_guided_debug(
                false, repeats, id(debug_cue_command).state);
          } else if (operation == "EEPROM Experiment") {
            started = id(jura_machine).start_guided_debug(
                true, repeats, id(debug_cue_command).state);
          } else if (operation == "RAM Dump") {
            started = id(jura_machine).start_discovery(::esphome::jura::JuraButtonType::RAM_DUMP);
          } else if (operation == "EEPROM Dump") {
            started = id(jura_machine).start_discovery(::esphome::jura::JuraButtonType::EEPROM_DUMP);
          }
          if (!started)
            ESP_LOGW("jura", "DEBUG_OPERATION: request rejected operation=%s", operation.c_str());

  - platform: template
    id: continue_debug_operation
    name: "Continue Debug Operation"
    icon: "mdi:debug-step-over"
    entity_category: diagnostic
    internal: ${hide_debug_tools}
    on_press:
      - lambda: |-
          const std::string observation = id(debug_operator_observation).state;
          if (id(jura_machine).continue_debug_operation()) {
            // continue_debug_operation() only sets the advance flag; the state
            // machine has not moved yet, so this note is attached to the exact
            // checkpoint the operator just confirmed.
            id(jura_machine).log_operator_observation(observation);
            // Clear only after an accepted Continue so a mistimed button press
            // cannot discard an observation before it has been logged.
            id(debug_operator_observation).publish_state("");
          } else {
            ESP_LOGW("jura", "DEBUG_OPERATION: Continue ignored; active debug operation is not waiting for operator input");
          }

  - platform: template
    id: cancel_operation
    name: "Cancel Operation"
    icon: "mdi:stop-circle-outline"
    on_press:
      - lambda: |-
          id(jura_machine).cancel_active_operation();

  - platform: template
    name: "Send Raw Jura Command"
    icon: "mdi:send"
    entity_category: diagnostic
    internal: ${hide_debug_tools}
    on_press:
      - lambda: |-
          const std::string command = id(jura_raw_command).state;
          if (!id(jura_machine).queue_raw_command(command))
            ESP_LOGW("jura", "RAW_COMMAND_EVENT: Home Assistant send request was rejected");

  - platform: restart
    name: "Restart ESPHome"
    entity_category: diagnostic

  - platform: safe_mode
    name: "Restart in Safe Mode"
    entity_category: diagnostic
