substitutions:
  device_name: jura
  friendly_name: Jura
  # ESPHome cannot reliably add/remove HA entities at runtime. Set this false
  # before compiling when research controls should be exposed to Home Assistant.
  hide_debug_tools: "true"
  # SNTP is used for syslog timestamps only. Clock/Timer Mapping uses relative millis().
  local_timezone: "America/Toronto"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # Register the existing template Grinder select after the Jura component has
  # loaded. Its options are then reduced to Default-only until a live recipe
  # slot is observed with function 0x12 (Grinder Selector). If that assignment
  # changes later, Home Assistant may need to reconnect to refresh select traits.
  on_boot:
    - priority: 550.0
      then:
        - lambda: |-
            id(jura_machine).register_grinder_select(*id(jura_grinder));

# Smaller ESP8266 build: WebServerBase only; no redundant stock web_server
# dashboard, REST entity layer, or server-sent event machinery.
# Both http://jura.local/ and /jura/ open the full visualizer, while the
# ESPHome native API/HA and UART discovery engine remain available.
web_server_base: {}

jura_web:
  id: jura_browser
  jura_id: jura_machine
  port: 80
  auth:
    username: !secret jura_web_username
    password: !secret jura_web_password

esp8266:
  board: esp12e

# GPIO1/GPIO3 are UART0 on ESP8266. Serial logging must remain disabled because
# the Jura service port owns this UART.
logger:
  baud_rate: 0
  # High-volume UART TX/RX still reaches the built-in web log directly.
  # INFO removes DEBUG format strings/call sites from the firmware.
  level: INFO
  logs:
    jura: INFO
    jura.discovery: INFO

# Persist logs off-device without wearing ESP flash.
time:
  - platform: sntp
    id: sntp_time
    timezone: ${local_timezone}

udp:
  id: syslog_udp
  addresses:
    - !secret jura_syslog_address

syslog:
  udp_id: syslog_udp
  time_id: sntp_time
  port: 514
  facility: 16
  level: INFO
  strip: true

api:
  # This ESP8266 exposes many EEPROM-backed entities. A single mapped recipe
  # page can initialize more states than the native API's small default send
  # queue, so batch state traffic and leave enough queue headroom for bursts.
  # ESP8266 has very little free heap. Keep the API queue deliberately small
  # and drain it quickly; a large delayed queue was observed in Soft-WDT
  # backtraces inside APIOverflowBuffer. A stalled log client should be dropped
  # rather than allowed to consume enough RAM/CPU to destabilize the device.
  batch_delay: 50ms
  max_connections: 2
  max_send_queue: 5
  encryption:
    key: !secret jura_api_key
  on_client_connected:
    - logger.log:
        level: INFO
        format: "API client connected: %s (%s)"
        args: ["client_info.c_str()", "client_address.c_str()"]
  on_client_disconnected:
    - logger.log:
        level: WARN
        format: "API client disconnected: %s (%s)"
        args: ["client_info.c_str()", "client_address.c_str()"]

ota:
  - platform: esphome
    password: !secret jura_ota_password

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 10
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 5
  fast_connect: true
  post_connect_roaming: false
  power_save_mode: none
  on_connect:
    - logger.log:
        level: INFO
        format: "WiFi connected"
  on_disconnect:
    - logger.log:
        level: WARN
        format: "WiFi disconnected"
  ap:
    ssid: "Jura Fallback Hotspot"
    password: !secret jura_fallback_password

safe_mode:
  num_attempts: 5

debug:
  update_interval: 60s

# IMPORTANT: jura.yaml and components/jura must come from the same release.
external_components:
  - source:
      type: local
      path: components
    components: [jura, jura_web]

uart:
  id: jura_uart
  tx_pin: GPIO1
  rx_pin:
    number: GPIO3
    inverted: false
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

jura:
  id: jura_machine
  uart_id: jura_uart
  time_id: sntp_time

  # Production state polling. No periodic IC: command is sent.
  power_poll_interval: 30s
  ready_poll_interval: 5s

  inter_character_delay: 8ms
  command_timeout: 5s
  startup_delay: 2s
  query_machine_type: true

  discovery:
    eeprom:
      start_address: 0x00
      end_address: 0xF0
      step: 0x10
      address_width: 2
    ram:
      start_address: 0x00
      end_address: 0xF0
      step: 0x10
      address_width: 2

  # Product/action commands are physical recipe slots, not fixed beverages.
  # EEPROM D4..FB assigns each slot's function. Factory/default mapping:
  #   Recipe 1=Coffee, 2=Espresso, 3=Grinder Selector, 4=2x,
  #   5=Cappuccino, 6=Latte Macchiato, 7=Macchiato, 8=Milk Froth,
  #   9=Hot Water, 10=Steam.
  # Recipe 1..8 are FA:01..FA:08; Recipe 9 is FA:00; Recipe 10 is FA:09.
  commands:
    power_on: "AN:01"
    power_off: "AN:02"
    recipe_1: "FA:01"
    recipe_2: "FA:02"
    recipe_3:
      command: "FA:03"
      repeat: 1
      repeat_delay: 1s
    recipe_4: "FA:04"
    recipe_5: "FA:05"
    recipe_6: "FA:06"
    recipe_7: "FA:07"
    recipe_8: "FA:08"
    recipe_9: "FA:00"
    recipe_10: "FA:09"
    program_settings: "FA:0A"
    rinse: "FA:0B"
    clean_coffee: "FA:0C"
    decalcifying: "FA:0D"
    clean_milk_system: "FA:0E"
    exit: "FA:0F"
    minus: "FA:10"
    plus: "FA:11"

# Operation/repeat and grinder are separate UI overrides with independent,
# persistent timeout configuration. A timeout of 0 disables automatic reset.
globals:
  - id: operation_reset_in_progress
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: grinder_reset_in_progress
    type: bool
    restore_value: false
    initial_value: 'false'

script:
  # Sliding Operation/Repeats timeout. Operation/Repeats changes and Start
  # restart it. 0 minutes disables automatic reset.
  - id: reset_operation_controls_timer
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(operation_reset_timeout).state > 0.0f;'
          then:
            - delay: !lambda |-
                return static_cast<uint32_t>(id(operation_reset_timeout).state * 60000.0f);
            - lambda: |-
                id(operation_reset_in_progress) = true;
            - lambda: |-
                auto call = id(jura_operation).make_call();
                call.set_index(0);
                call.perform();
            - number.set:
                id: operation_repeats
                value: 1
            - lambda: |-
                id(operation_reset_in_progress) = false;
                ESP_LOGI("jura", "OPERATION_UI: timeout -> slot 1 Repeats=1");

  # Independent grinder-override timeout. It is armed only for a non-Default
  # grinder selection; 0 minutes disables it. Start also refreshes the timer.
  # The batch engine captures its requested grinder at Start, so a later UI
  # timeout does not mutate the active operation.
  - id: reset_grinder_override_timer
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(grinder_override_timeout).state > 0.0f &&
                     id(jura_grinder).current_option() != "Default";
          then:
            - delay: !lambda |-
                return static_cast<uint32_t>(id(grinder_override_timeout).state * 60000.0f);
            - lambda: |-
                id(grinder_reset_in_progress) = true;
            - select.set:
                id: jura_grinder
                option: "Default"
            - lambda: |-
                id(grinder_reset_in_progress) = false;
                ESP_LOGI("jura", "GRINDER_UI: override timeout -> Grinder=Default");

binary_sensor:
  - platform: status
    name: "Status"

  - platform: jura
    jura_id: jura_machine
    communication:
      name: "Jura Communication"
    powered_on:
      id: jura_powered_on
      name: "Jura Powered On"
    tray_missing:
      name: "Drip Tray Missing"
    grounds_bin_missing:
      name: "Grounds Bin Missing"
    fill_tank:
      name: "Fill Water / Tank Float"
    fill_beans_left:
      name: "Fill Beans Left"
    fill_beans_right:
      name: "Fill Beans Right"
    light_recipe_1:
      name: "Recipe 1 Light Active"
    light_recipe_2:
      name: "Recipe 2 Light Active"
    light_recipe_3:
      name: "Recipe 3 Light Active"
    light_recipe_4:
      name: "Recipe 4 Light Active"
    light_recipe_5:
      name: "Recipe 5 Light Active"
    light_recipe_6:
      name: "Recipe 6 Light Active"
    light_recipe_7:
      name: "Recipe 7 Light Active"
    light_recipe_8:
      name: "Recipe 8 Light Active"
    flash_recipe_1:
      name: "Recipe 1 Light Flashing"
    flash_recipe_2:
      name: "Recipe 2 Light Flashing"
    flash_recipe_3:
      name: "Recipe 3 Light Flashing"
    flash_recipe_4:
      name: "Recipe 4 Light Flashing"
    flash_recipe_5:
      name: "Recipe 5 Light Flashing"
    flash_recipe_6:
      name: "Recipe 6 Light Flashing"
    flash_recipe_7:
      name: "Recipe 7 Light Flashing"
    flash_recipe_8:
      name: "Recipe 8 Light Flashing"

sensor:
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: debug
    free:
      name: "Heap Free"
      entity_category: diagnostic
    block:
      name: "Heap Max Block"
      entity_category: diagnostic
    fragmentation:
      name: "Heap Fragmentation"
      entity_category: diagnostic
    loop_time:
      name: "Loop Time"
      entity_category: diagnostic

  - platform: jura
    jura_id: jura_machine

    # Mapped lifetime/service statistics. These also provide the authoritative
    # completion proof for supported batch beverage operations.
    lifetime_coffee:
      name: "Lifetime Coffee"
    lifetime_espresso:
      name: "Lifetime Espresso"
    lifetime_cappuccino:
      name: "Lifetime Cappuccino"
    lifetime_latte_macchiato:
      name: "Lifetime Latte Macchiato"
    lifetime_macchiato:
      name: "Lifetime Macchiato"
    lifetime_milk_froth:
      name: "Lifetime Milk Froth"
    lifetime_hot_water:
      name: "Lifetime Hot Water"
    lifetime_steam:
      name: "Lifetime Steam"
    lifetime_rinse:
      name: "Lifetime Rinse"
    lifetime_clean_cappu:
      name: "Lifetime Clean Cappu"
    lifetime_filter_changes:
      name: "Lifetime Filter Changes"
    lifetime_cleaning:
      name: "Lifetime Cleaning Cycles"
    lifetime_descaling:
      name: "Lifetime Descaling Cycles"
    lifetime_power_on:
      name: "Lifetime Power On / Wake"

    communication_errors:
      name: "Jura Communication Errors"

    # Keep only the two production RAM values visible; full state research uses
    # the guided RAM/EEPROM experiment selected from the Operation dropdown.
    ram_16:
      name: "Power State Raw (RAM 0x16)"
    ram_f0_f1:
      name: "RAM F0-F1 Raw (Unmapped)"

number:
  # Resettable/user product counters remain writable configuration entities.
  # Writes are RE -> WE -> RE verified by the component.
  - platform: jura
    jura_id: jura_machine
    user_coffee:
      name: "User Coffee Counter"
    user_espresso:
      name: "User Espresso Counter"
    user_cappuccino:
      name: "User Cappuccino Counter"
    user_latte_macchiato:
      name: "User Latte Macchiato Counter"
    user_macchiato:
      name: "User Macchiato Counter"
    user_milk_froth:
      name: "User Milk Froth Counter"
    user_hot_water:
      name: "User Hot Water Counter"
    user_steam:
      name: "User Steam Counter"

    # EEPROM D4..FB is ten fixed 8-byte recipe/action slots. On ESP8266 we
    # deliberately expose ONE recipe editor rather than 60 permanent slot-number
    # entities. Operation selects the physical Recipe slot; edit the shared fields below.
    # The component still caches all ten slots internally for batch execution and
    # function remapping. Direct writes remain gated by Recipe EEPROM Writes.
    recipe_editor_temperature:
      name: "Recipe Editor Temperature"
    recipe_editor_grinder_balance:
      name: "Recipe Editor Grinder Balance"
    recipe_editor_powder:
      name: "Recipe Editor Powder Raw"
    recipe_editor_water:
      name: "Recipe Editor Water"
    recipe_editor_milk:
      name: "Recipe Editor Milk"
    recipe_editor_froth:
      name: "Recipe Editor Froth"

  # Machine auto-off delay from EEPROM 0x26. The low byte is confirmed to be
  # half-hour units (0=Disabled, 1=0.5 h, ... 18=9 h). The component preserves
  # the high byte and verifies the write with RE -> WE -> RE.
  - platform: template
    id: jura_auto_off_delay
    name: "Auto-Off Delay"
    unit_of_measurement: "h"
    icon: "mdi:timer-off-outline"
    entity_category: config
    mode: box
    update_interval: 30s
    min_value: 0
    max_value: 9
    step: 0.5
    lambda: |-
      if (!id(jura_machine).has_auto_off_setting())
        return {};
      return id(jura_machine).get_auto_off_hours();
    set_action:
      - lambda: |-
          id(jura_machine).request_auto_off_hours(x);

  # 0 disables time-based mapped-counter polling. Other allowed values are
  # 5, 10, ... seconds. Restored after ESPHome reboot; default 30 seconds.
  - platform: template
    id: counter_poll_interval
    name: "Counter Poll Interval"
    unit_of_measurement: "s"
    icon: "mdi:counter"
    entity_category: config
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 30
    min_value: 0
    max_value: 3600
    step: 5
    set_action:
      - lambda: |-
          id(jura_machine).set_eeprom_probe_interval_seconds(x);
    on_value:
      then:
        - lambda: |-
            id(jura_machine).set_eeprom_probe_interval_seconds(x);

  # Additional delay after the lifetime counter proves one product completed
  # before the next product in the same batch starts. 0 disables this extra
  # delay. Product-specific minimum brew times remain enforced separately.
  - platform: template
    id: inter_product_delay
    name: "Inter-Product Delay"
    unit_of_measurement: "s"
    icon: "mdi:timer-sand"
    entity_category: config
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 10
    min_value: 0
    max_value: 3600
    step: 1
    set_action:
      - lambda: |-
          id(jura_machine).set_inter_product_delay_seconds(x);
    on_value:
      then:
        - lambda: |-
            id(jura_machine).set_inter_product_delay_seconds(x);

  # Sliding UI timeout for Operation + Repeats. 0 disables reset.
  - platform: template
    id: operation_reset_timeout
    name: "Operation Reset Timeout"
    unit_of_measurement: "min"
    icon: "mdi:timer-refresh-outline"
    entity_category: config
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 5
    min_value: 0
    max_value: 1440
    step: 1
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x <= 0.0f;'
            then:
              - script.stop: reset_operation_controls_timer
            else:
              - script.execute: reset_operation_controls_timer

  # Independent timeout for a non-Default grinder override. 0 disables reset
  # and therefore preserves the selected grinder indefinitely.
  - platform: template
    id: grinder_override_timeout
    name: "Grinder Override Timeout"
    unit_of_measurement: "min"
    icon: "mdi:timer-cog-outline"
    entity_category: config
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 1440
    step: 1
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x <= 0.0f;'
            then:
              - script.stop: reset_grinder_override_timer
            else:
              - if:
                  condition:
                    lambda: 'return id(jura_grinder).current_option() != "Default";'
                  then:
                    - script.execute: reset_grinder_override_timer

  # Shared by both beverage batches and guided RAM/EEPROM experiments.
  - platform: template
    id: operation_repeats
    name: "Operation Repeats"
    icon: "mdi:repeat"
    mode: box
    optimistic: true
    restore_value: false
    initial_value: 1
    min_value: 1
    max_value: 20
    step: 1
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !id(operation_reset_in_progress);'
            then:
              - script.execute: reset_operation_controls_timer

  # Used only for the automatic time-series gap in Clock/Timer Mapping.
  # RAM/EEPROM experiments are operator-paced with Continue Debug Operation.
  # Diagnostic/disabled-by-default to keep the normal entity list small.
  - platform: template
    id: experiment_window
    name: "Experiment Window"
    internal: ${hide_debug_tools}
    unit_of_measurement: "s"
    icon: "mdi:timer-outline"
    entity_category: diagnostic
    disabled_by_default: true
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 10
    min_value: 1
    max_value: 120
    step: 1

datetime:
  # Jura stores scheduled times as one 16-bit EEPROM word: binary hour in the
  # high byte and minute in the low byte. 0x8000 means unset/disabled. Editing
  # either time directly enables that schedule; the separate switches can then
  # disable/re-enable it.
  - platform: template
    id: jura_scheduled_power_on_time
    type: time
    name: "Scheduled Power On Time"
    icon: "mdi:clock-start"
    entity_category: config
    update_interval: 30s
    lambda: |-
      uint8_t hour = 0;
      uint8_t minute = 0;
      if (!id(jura_machine).get_scheduled_power_time(true, hour, minute))
        return {};
      ESPTime value{};
      value.hour = hour;
      value.minute = minute;
      value.second = 0;
      return value;
    set_action:
      - lambda: |-
          id(jura_machine).request_scheduled_power_time(true, x.hour, x.minute);

  - platform: template
    id: jura_scheduled_power_off_time
    type: time
    name: "Scheduled Power Off Time"
    icon: "mdi:clock-end"
    entity_category: config
    update_interval: 30s
    lambda: |-
      uint8_t hour = 0;
      uint8_t minute = 0;
      if (!id(jura_machine).get_scheduled_power_time(false, hour, minute))
        return {};
      ESPTime value{};
      value.hour = hour;
      value.minute = minute;
      value.second = 0;
      return value;
    set_action:
      - lambda: |-
          id(jura_machine).request_scheduled_power_time(false, x.hour, x.minute);

select:
  # Function/type is the high byte of each slot's first EEPROM word. State is
  # read back from EEPROM; selecting a new value performs RE -> masked WE -> RE.
  # 0x1A..0x1C are intentionally excluded because testing wedged Product Settings.
  - platform: jura
    jura_id: jura_machine
    recipe_editor_function:
      name: "Recipe Editor Function"
    recipe_editor_preset:
      name: "Recipe Editor Preset"
    operation:
      id: jura_operation
      name: "Operation"
      on_value:
        then:
          - if:
              condition:
                lambda: 'return !id(operation_reset_in_progress);'
              then:
                - script.execute: reset_operation_controls_timer

  - platform: template
    id: jura_debug_operation
    name: "Debug Operation"
    icon: "mdi:bug-outline"
    entity_category: diagnostic
    internal: ${hide_debug_tools}
    optimistic: true
    restore_value: false
    initial_option: "Grinder Mapping"
    options:
      - "Grinder Mapping"
      - "Clock/Timer Mapping"
      - "Top-Level Menu RAM Discovery"
      - "Menu Section RAM Discovery"
      - "Full Menu RAM Discovery"
      - "RAM Experiment"
      - "EEPROM Experiment"
      - "RAM Dump"
      - "EEPROM Dump"


  - platform: template
    id: jura_menu_discovery_section
    name: "Menu Discovery Section"
    icon: "mdi:menu-open"
    entity_category: diagnostic
    internal: ${hide_debug_tools}
    optimistic: true
    restore_value: true
    initial_option: "Water Hardness"
    options:
      - "Water Hardness"
      - "Product Settings"
      - "Product: Water"
      - "Product: Froth"
      - "Product: Milk"
      - "Product: Powder"
      - "Product: Grinder"
      - "Product: Temperature"
      - "Time"
      - "Timer"
      - "Timer: Unit On"
      - "Timer: Machine Off"
      - "Timer: Weekdays"
      - "Off After"
      - "Rinsing"
      - "Language"
      - "Display"
      - "Information"

  - platform: template
    id: jura_grinder
    name: "Grinder"
    icon: "mdi:grain"
    optimistic: true
    restore_value: true
    initial_option: "Default"
    options:
      - "Default"
      - "Left"
      - "Right (Decaf)"
      - "Both"
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x != "Default" && !id(jura_machine).has_grinder_selector_button();'
            then:
              - lambda: |-
                  ESP_LOGW("jura", "GRINDER_UI: selection rejected because no recipe button is assigned Grinder Selector");
                  id(grinder_reset_in_progress) = true;
              - select.set:
                  id: jura_grinder
                  option: "Default"
              - lambda: |-
                  id(grinder_reset_in_progress) = false;
            else:
              - if:
                  condition:
                    lambda: 'return !id(grinder_reset_in_progress);'
                  then:
                    - if:
                        condition:
                          lambda: 'return x == "Default" || id(grinder_override_timeout).state <= 0.0f;'
                        then:
                          - script.stop: reset_grinder_override_timer
                        else:
                          - script.execute: reset_grinder_override_timer

text:
  # Raw protocol access is intentionally diagnostic, not configuration.
  - platform: template
    id: jura_raw_command
    name: "Raw Jura Command"
    internal: ${hide_debug_tools}
    icon: "mdi:console-line"
    entity_category: diagnostic
    optimistic: true
    restore_value: false
    initial_value: ""
    min_length: 0
    max_length: 23
    mode: text

  # Operator-supplied observation captured at the next accepted Continue.
  # Useful for values visible only on the Jura LCD (for example "40 mL",
  # "bar 3/5", or lamp/button observations). The Continue button logs the
  # text against the exact active discovery state and then clears this entity.
  - platform: template
    id: debug_operator_observation
    name: "Debug Operator Observation"
    internal: ${hide_debug_tools}
    icon: "mdi:text-box-edit-outline"
    entity_category: diagnostic
    optimistic: true
    restore_value: false
    initial_value: ""
    min_length: 0
    max_length: 96
    mode: text

  # Optional physical cue for guided experiments. Hidden by default until a
  # harmless beep-only command is positively identified.
  - platform: template
    id: debug_cue_command
    name: "Debug Cue Command"
    internal: ${hide_debug_tools}
    icon: "mdi:bell-outline"
    entity_category: diagnostic
    disabled_by_default: true
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 23
    mode: text

text_sensor:
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic

  - platform: debug
    reset_reason:
      name: "ESP Reset Reason"
      entity_category: diagnostic

  - platform: wifi_info
    bssid:
      name: "Connected BSSID"
      entity_category: diagnostic
    ssid:
      name: "Connected SSID"
      entity_category: diagnostic
    power_save_mode:
      name: "WiFi Power Save Mode"
      entity_category: diagnostic

  - platform: jura
    jura_id: jura_machine
    machine_type:
      name: "Jura Machine Type"
      entity_category: diagnostic
