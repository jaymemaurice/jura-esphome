switch:
  # State is non-optimistic and comes from RAM 0x16, not AN:01/AN:02 response.
  - platform: jura
    jura_id: jura_machine
    power:
      name: "Power"

  # Safety gate for direct EEPROM recipe edits. Read-only recipe values continue
  # to refresh while OFF. This intentionally resets OFF after every ESP reboot.
  - platform: template
    id: recipe_eeprom_writes
    name: "Recipe EEPROM Writes"
    icon: "mdi:database-edit-outline"
    entity_category: config
    restore_mode: ALWAYS_OFF
    lambda: |-
      return id(jura_machine).are_recipe_writes_enabled();
    turn_on_action:
      - lambda: |-
          id(jura_machine).set_recipe_writes_enabled(true);
    turn_off_action:
      - lambda: |-
          id(jura_machine).set_recipe_writes_enabled(false);

  # Power-on/off clock enable state. EEPROM 0x25 and 0x28 use 0x8000 for
  # disabled. Re-enabling restores the last time observed by this ESP boot, or
  # 00:00 if the machine booted with the schedule unset and no prior time exists.
  - platform: template
    id: jura_scheduled_power_on
    name: "Scheduled Power On"
    icon: "mdi:power-on"
    entity_category: config
    lambda: |-
      if (!id(jura_machine).has_scheduled_power_on_state())
        return {};
      return id(jura_machine).is_scheduled_power_on_enabled();
    turn_on_action:
      - lambda: |-
          id(jura_machine).request_scheduled_power_enabled(true, true);
    turn_off_action:
      - lambda: |-
          id(jura_machine).request_scheduled_power_enabled(true, false);

  - platform: template
    id: jura_scheduled_power_off
    name: "Scheduled Power Off"
    icon: "mdi:power-off"
    entity_category: config
    lambda: |-
      if (!id(jura_machine).has_scheduled_power_off_state())
        return {};
      return id(jura_machine).is_scheduled_power_off_enabled();
    turn_on_action:
      - lambda: |-
          id(jura_machine).request_scheduled_power_enabled(false, true);
    turn_off_action:
      - lambda: |-
          id(jura_machine).request_scheduled_power_enabled(false, false);

  # EEPROM 0x57 low bits 0..6 are confirmed Monday..Sunday power-on days.
  # The component preserves the high byte and the currently unknown bit 7.
  - platform: template
    id: jura_power_on_monday
    name: "Power On Monday"
