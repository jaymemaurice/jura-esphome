# TEMPORARY firmware for devices whose current ESP8266 image leaves
# insufficient space for an OTA update. Flash this over OTA FIRST, then
# immediately flash jura.yaml (the full build) while this tiny image runs.
# This is not a replacement for 4 MB flash if seamless OTA is required.
substitutions:
  device_name: jura
esphome:
  name: ${device_name}
esp8266:
  board: esp12e
logger:
  baud_rate: 0
  level: WARN
wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 10
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 5
  fast_connect: true
  post_connect_roaming: false
  power_save_mode: none
ota:
  - platform: esphome
    password: !secret jura_ota_password
safe_mode:
  num_attempts: 5
# Intentionally no Jura UART, syslog, API, web UI, or machine polling.
