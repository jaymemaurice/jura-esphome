      - type: markdown
        content: |
          **Scheduling EEPROM:** power-on time is `0x25`, auto-off is `0x26`,
          power-off time is `0x28`, and power-on weekdays are `0x57` bits 0–6.
          `0x8000` means a scheduled on/off time is disabled. Setting a time
          directly enables that schedule; schedule writes are read-back verified.

      - type: markdown
        content: |
          ## Recipe/action slots
          `D4..FB` contains ten fixed recipe/action slots. **Function** and **Preset**
          are intentionally independent. Function changes only the action/type byte;
          Preset changes the parameter profile while preserving the function. This
          allows combinations such as an Espresso function with Coffee water/strength.
          Manual parameter edits make the Preset state `Custom`. **Recipe EEPROM Writes**
          must be ON before either type of EEPROM edit is accepted and resets OFF at
          reboot. `0x1A..0x1C` are intentionally not offered because they wedged Product Settings.

      - type: entities
        title: Recipe Editor
        show_header_toggle: false
        entities:
          - select.kitchen_jura_operation
          - select.kitchen_jura_recipe_editor_function
          - select.kitchen_jura_recipe_editor_preset
          - number.kitchen_jura_recipe_editor_temperature
          - number.kitchen_jura_recipe_editor_grinder_balance
          - number.kitchen_jura_recipe_editor_powder_raw
          - number.kitchen_jura_recipe_editor_water
          - number.kitchen_jura_recipe_editor_milk
          - number.kitchen_jura_recipe_editor_froth

      - type: markdown
        content: |
          The ESP8266 keeps all ten recipe slots cached internally, but only the
          selected slot is exposed through the editor entities to preserve heap.
          Changing **Operation** to one of the first ten recipe entries immediately refreshes Function, Preset,
          and all six parameters from that slot. The same Operation entity is used for
          both editing and Start Operation; its first ten choices are the physical recipe slots.


