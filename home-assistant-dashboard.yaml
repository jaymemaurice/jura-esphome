title: Kitchen Jura
views:
  - title: Jura
    path: jura
    icon: mdi:coffee-maker
    cards:
      - type: markdown
        content: |
          ## Jura
          Select an **Operation**, set **Repeats**, then press **Start Operation**.
          Beverage batches advance only after the mapped lifetime counter proves
          that the preceding product completed. The delay before the next product is
          configurable. Operation/Repeats and Grinder have separate configurable
          reset timers. Set either timeout to `0`
          to disable that reset. Grinder timeout returns it to `Default`.

          **Grinder:** the machine's RAM `0x05` state is now authoritative:
          `0=Default`, `1=Left`, `2=Right (Decaf)`, `3=Both`. Before each
          grinder-using product, ESPHome reads the current state, presses whichever
          physical Recipe button is currently assigned `Grinder Selector` (`0x12`),
          re-reads `0x05`, and will not brew unless the requested grinder is verified.
          If no button is assigned `0x12`, the Grinder select is reduced to `Default`
          only; reconnect Home Assistant to ESPHome after a remap if its options are stale.

          **Status:** each mapped EEPROM-counter refresh is preceded by `RR:00`.
          RAM `0x0E` drives tray, grounds-bin, and water/tank-float warnings;
          provisional RAM `0x07` drives left/right Fill Beans warnings.

          **Maintenance:** Rinse, Clean Coffee, Decalcifying, and Clean Milk System
          are available from the production Operation dropdown.

          **Research:** debug controls are hidden from Home Assistant by default.
          Set `hide_debug_tools: "false"` in ESPHome and recompile to expose the
          separate Debug Operation selector, experiments/dumps, and raw-command tools.
          `Top-Level Menu RAM Discovery` maps the top-level ring. `Menu Section RAM Discovery` runs the selected bounded `Menu Discovery Section`; `Full Menu RAM Discovery` walks the complete graph. Menu discovery is RAM-only in v22.19.3: editable states are automatically probed +1 then -1 without saving the changed value; EEPROM is not read or written. Persistent EEPROM discovery will be added only after repeated RAM captures provide deterministic state signatures. `Clock/Timer Mapping` uses four snapshots and `Experiment Window (clock timeline only)`. Enter visible LCD values, bar-graph positions, lamp observations, or other notes in `Debug Operator Observation`; every accepted Continue logs and clears the field. Generic RAM/EEPROM experiments remain operator-paced.

